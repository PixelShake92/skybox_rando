# Config file for the Banjo-Kazooie: Recompiled skybox mod.

# Fields that end up in the mod's manifest.
[manifest]

# Unique ID of this mod. Pick something long enough that it'll never be the same as any other mod.
# The name displayed in the mod management menu is separate from this so this doesn't need to be human readable.
id = "skybox_selector"

# Version of this mod.
version = "1.0.0"

# The name that will show up for this mod in the mod menu. This should be human readable.
display_name = "Skybox Selector"

# The description that will show up when this mod is displayed in the mod menu. This should be human readable.
description = """
Pick the sky for each world, or set them to Rand and see something different every time you drop in."""

# A short description that will show up in this mod's entry in the mod list. This should be human readable and kept short
# to prevent it from being cut off due to the limited space.
short_description = "Mad Monster in day time? Treasure Trove with Moonlight?"

# Authors of this mod.
authors = [ "PixelShake92" ]

# ID of the target recomp game.
game_id = "bk"

# Minimum version of the target recomp (e.g. Banjo-Kazooie: Recompiled) that this mod can run on.
minimum_recomp_version = "0.0.1"

# Dependency mods. Each entry is the mod's ID and then an optional minimum version of the dependency mod.
dependencies = [
# Example dependency:
#    "modname:1.0.0"
]

# Native libraries (e.g. DLLs) and the functions they export.
native_libraries = [
# Example native library:
#    { name = "my_native_library", funcs = ["my_native_library_function"] }
]

# Inputs to the mod tool.
[inputs]

# Input elf file to generate a mod from.
elf_path = "build/mod.elf"

# Output mod filename.
mod_filename = "skybox_selector"

# Reference symbol files.
func_reference_syms_file = "BanjoRecompSyms/bk.us.rev0.syms.toml"
data_reference_syms_files = [ "BanjoRecompSyms/bk.us.rev0.datasyms.toml", "BanjoRecompSyms/bk.us.rev0.datasyms_static.toml" ]

# Additional files to include in the mod.
additional_files = [ "thumb.png" ]

# Per stage sky selection. Option order must match sky_source_maps in src/skybox_rando.c.

[[manifest.config_options]]
id = "sky_sm"
name = "Spiral Mountain Sky"
description = """
SM Spiral Mountain, MM Mumbo's Mountain, TT Ticker's Tower, TTC Treasure Trove Cove,
GV Gobi's Valley, MMM Mad Monster Mansion, FP Freezeezy Peak, RBB Rusty Bucket Bay,
Lair Gruntilda's Lair, Fall Grunty's Fall, Beach ending beach, N64 the intro logo sky.
Rand picks again on every entry into the area. """
type = "Enum"
options = [ "Van", "Rand", "SM", "MM", "TT", "TTC", "GV", "MMM", "FP", "RBB",
  "Lair", "Fall", "Beach", "N64" ]
default = "Van"

